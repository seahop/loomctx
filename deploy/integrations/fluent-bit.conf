# Fluent Bit -> Loom, no SDK (D-034).
#
# Any INPUT works (tail, systemd, syslog, forward, kubernetes, ...). The Lua
# FILTER reshapes each record into a Loom claim envelope; the http OUTPUT
# posts JSON batches to POST /v1/ingest/batch on the engine or the gateway.
#
#   docker run --rm --network loom_default \
#     -v "<repo>/deploy/integrations:/fluent-bit/etc:ro" fluent/fluent-bit:3.2 \
#     -c /fluent-bit/etc/fluent-bit.conf
# (classic-format config: no inline comments after values)

[SERVICE]
    Flush        2
    Log_Level    info

[INPUT]
    Name         dummy
    Tag          auth
    Dummy        {"host":"web-02","user":"asmith","method":"ssh","id":"fb-1"}
    Rate         2

[FILTER]
    Name         lua
    Match        auth
    script       /fluent-bit/etc/to_loom.lua
    call         to_loom_claim

[OUTPUT]
    Name         http
    Match        auth
    Host         loom
    Port         8000
    URI          /v1/ingest/batch
    Format       json
    Json_date_key false
    Header       Content-Type application/json
    Retry_Limit  5
    # Add a write-only, source-pinned key:
    # Header     X-Loom-Key loomk_...
