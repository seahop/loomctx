apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Scale shape (docs/decisions.md D-010): base plus NATS JetStream, an
# autoscaled Go gateway tier, and a writer-consumer sidecar on the engine pod.
# Apply with: kubectl apply -k deploy/k8s/scale

namespace: loomctx

resources:
  - ../base
  - nats.yaml
  - gateway.yaml
  - networkpolicy.yaml
  - pdb.yaml

patches:
  - path: loomctx-consumer-sidecar.yaml

images:
  - name: ghcr.io/seahop/loomctx-gateway
    newTag: latest
