apiVersion: apps/v1
kind: Deployment
metadata:
  name: loomctx-gateway
  labels:
    app: loomctx-gateway
spec:
  # Stateless by design (D-010): the Service round-robins across replicas and
  # the HPA below adds more under load. This IS the load-balancing story —
  # boring, native, no custom proxy.
  replicas: 2
  selector:
    matchLabels:
      app: loomctx-gateway
  template:
    metadata:
      labels:
        app: loomctx-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/seahop/loomctx-gateway:latest
          # a static binary that reads its schema and (optionally) a keys
          # file: nothing is written anywhere
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LOOMCTX_NATS_URL
              value: nats://nats:4222
            # single-node JetStream here: one replica, and a 1 GiB cap that
            # matches the 1Gi NATS PVC in nats.yaml — raise both together
            - name: LOOMCTX_STREAM_REPLICAS
              value: "1"
            - name: LOOMCTX_STREAM_MAX_BYTES
              value: "1073741824"
            - name: LOOMCTX_STREAM_DISCARD
              value: "old"
            # --- auth (D-013a): the same keys file the engine mounts;
            # uncomment once the `loomctx-keys` Secret exists (deploy/README.md).
            # Until then the gateway runs in open dev mode and logs it.
            # - name: LOOMCTX_AUTH_FILE
            #   value: /etc/loomctx-keys/keys.json
          # volumeMounts:
          #   - name: keys
          #     mountPath: /etc/loomctx-keys   # not /etc/loomctx: that would hide the image's /etc/loomctx/schemas.json
          #     readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
      # volumes:
      #   - name: keys
      #     secret:
      #       secretName: loomctx-keys
---
apiVersion: v1
kind: Service
metadata:
  name: loomctx-gateway
  labels:
    app: loomctx-gateway
spec:
  selector:
    app: loomctx-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loomctx-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loomctx-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
