# NATS JetStream: the durable buffer between the gateways and the writer
# consumers (D-010). The stream lives on a PVC so a pod restart keeps the
# queue — that is what makes "at-least-once" true across restarts. Recreate
# strategy: exactly one server owns the store dir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nats-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      # the gateway caps the ingest stream at LOOMCTX_STREAM_MAX_BYTES (1 GiB
      # here) and the consumer caps the dead-letter stream at 256 MiB; the
      # claim must hold both plus headroom
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  labels:
    app: nats
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # writes only under -sd /data
            capabilities:
              drop: [ALL]
          args: ["-js", "-sd", "/data", "-m", "8222"]
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 8222
              name: monitor
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nats-data
---
# Client Service only: the monitor port (8222) is for the probes, which the
# kubelet reaches on the pod directly, and for a scraper that targets pods.
apiVersion: v1
kind: Service
metadata:
  name: nats
spec:
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
