apiVersion: apps/v1
kind: Deployment
metadata:
  name: loomctx
  labels:
    app: loomctx
spec:
  # SQLite on an RWO volume => exactly one replica, and Recreate so upgrades
  # never run two writers. Scaling out = swapping in a server-backed
  # GraphStore (docs/decisions.md D-008); the pod spec doesn't change.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loomctx
  template:
    metadata:
      labels:
        app: loomctx
    spec:
      # nothing here talks to the Kubernetes API
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loomctx
          image: ghcr.io/seahop/loomctx:latest
          # read-only root: the engine writes only to /data (the store) and
          # /tmp (an emptyDir); no capability is needed to serve HTTP on 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: LOOMCTX_DB
              value: /data/loomctx.db
            # --- auth (D-013a / D-021): uncomment once the `loomctx-keys` Secret
            # exists (deploy/README.md). Until then the engine runs in open
            # dev mode and logs a warning at startup.
            # - name: LOOMCTX_AUTH_FILE
            #   value: /etc/loomctx-keys/keys.json
            # - name: LOOMCTX_HANDLE_SECRET
            #   valueFrom:
            #     secretKeyRef: {name: loomctx-keys, key: handle-secret}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            # - name: keys
            #   mountPath: /etc/loomctx-keys
            #   readOnly: true
          readinessProbe:
            httpGet:
              path: /readyz     # probes the store, not just the process
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: loomctx-data
        - name: tmp
          emptyDir: {}
        # - name: keys
        #   secret:
        #     secretName: loomctx-keys
