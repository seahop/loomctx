# Capacity evidence (D-027 6.7 / D-001a: measure, don't assume). Run the
# load generator inside the cluster against the gateway Service (ingest) or
# the engine Service (ask):
#   kubectl -n loomctx apply -f deploy/k8s/jobs/loadgen.yaml
#   kubectl -n loomctx logs job/loomctx-loadgen -f
# Edit args for --mode ask / --count / --concurrency. Delete and re-apply to
# run again (Jobs are immutable).
apiVersion: batch/v1
kind: Job
metadata:
  name: loomctx-loadgen
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loadgen
          image: ghcr.io/seahop/loomctx:latest
          command: ["python", "-m", "loomctx.loadgen"]
          args: ["--url", "http://loomctx-gateway", "--count", "5000", "--concurrency", "32", "--namespace", "loadtest"]
          # with auth on (the loomctx-keys Secret), give the generator a key that
          # may write (and read, for --mode ask) the loadtest namespace:
          # env:
          #   - name: LOOMCTX_API_KEY
          #     valueFrom: {secretKeyRef: {name: loomctx-loadgen-key, key: key}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: tmp
          emptyDir: {}
