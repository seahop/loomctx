# Real data on a schedule (D-035): pull CISA KEV + NVD + EPSS every night and
# load them through the engine's batch API. Re-runs are idempotent; a record
# NVD has re-scored since yesterday records a NEW observation, so the
# namespace accumulates real history and `as_of` questions mean something.
#
#   kubectl -n loom create secret generic loom-vulns-key --from-literal=key=loomk_...   # an rw key pinned to sources 'nvd,nvd:*,cisa-kev,first-epss,cisa-adp' (nvd:* = the per-scorer CVSS sources)
#
# The key needs `r` as well as `w` (perms rw) on the namespace. The run
# reads the registry first to see whether its schema is already there — a
# key without `r` cannot, so it falls through to registering, which a pinned
# key may not do: 403, and the run fails. It also reads the CVE's stored
# KEV rows to find a changed KEV entry (a ransomware flag flipped, a due
# date moved; S-29).
#
# The FIRST load is an operator's job, with a key that has no source or
# entity-type gate: it registers the namespace schema (a pinned key may not)
# and, with --bridge-seed-hosts, writes the asset-inventory bridge. Run it
# once as a one-off pod (a Job's pod template is immutable, so a Job created
# from this CronJob cannot be pointed at another Secret):
#
#   read -rs OPKEY   # the ungated operator key; kept out of shell history
#   kubectl -n loom run vulns-first-load --rm -i --restart=Never \
#     --image=ghcr.io/seahop/loom:latest --env="LOOM_API_KEY=$OPKEY" -- \
#     python -m loom.connectors.vulns load --url http://loom --cache /tmp/feeds \
#       --namespace netsec --bridge-seed-hosts
#
# (the key is in that pod's spec until --rm deletes it). Every nightly run
# after it finds the schema registered and needs only the pinned key (D-063):
#
#   kubectl -n loom apply -f deploy/k8s/jobs/vulns-refresh.yaml
#   kubectl -n loom create job --from=cronjob/loom-vulns-refresh vulns-now   # run once, now
#
# The feed cache lives on a small PVC so unchanged feeds are not re-downloaded
# (conditional GETs). Point --url at the gateway Service in the scale shapes.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loom-feed-cache
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: loom-vulns-refresh
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: vulns
              image: ghcr.io/seahop/loom:latest
              command: ["python", "-m", "loom.connectors.vulns"]
              args: ["load", "--url", "http://loom", "--cache", "/cache", "--namespace", "netsec"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: LOOM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: loom-vulns-key
                      key: key
                      # REQUIRED on purpose: a job that loads a public feed
                      # into the store must not silently run keyless. In
                      # open dev mode create the Secret with any value.
                      optional: false
              volumeMounts:
                - name: cache
                  mountPath: /cache
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: cache
              persistentVolumeClaim:
                claimName: loom-feed-cache
            - name: tmp
              emptyDir: {}
