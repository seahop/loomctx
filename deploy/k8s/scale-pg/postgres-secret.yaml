# Point LoomCtx at your Postgres (managed, operator-run, or in-cluster).
# Replace the DSN below — or better, manage this Secret with your usual
# machinery (External Secrets, sealed-secrets) and delete this file from
# the kustomization.
apiVersion: v1
kind: Secret
metadata:
  name: loomctx-db
type: Opaque
stringData:
  LOOMCTX_DB: postgresql://loomctx:CHANGE-ME@your-postgres:5432/loomctx
