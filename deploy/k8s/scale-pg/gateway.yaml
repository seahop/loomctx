apiVersion: apps/v1
kind: Deployment
metadata:
  name: loom-gateway
  labels:
    app: loom-gateway
spec:
  # Stateless by design (D-010): the Service round-robins across replicas and
  # the HPA below adds more under load. This IS the load-balancing story —
  # boring, native, no custom proxy.
  replicas: 2
  selector:
    matchLabels:
      app: loom-gateway
  template:
    metadata:
      labels:
        app: loom-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/seahop/loom-gateway:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: LOOM_NATS_URL
              value: nats://nats:4222
            # replicated ingest stream on the 3-node cluster (D-029); cap the
            # buffer at 4 GiB and shed the oldest when full
            - name: LOOM_STREAM_REPLICAS
              value: "3"
            - name: LOOM_STREAM_MAX_BYTES
              value: "4294967296"
            - name: LOOM_STREAM_DISCARD
              value: "old"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: loom-gateway
  labels:
    app: loom-gateway
spec:
  selector:
    app: loom-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loom-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loom-gateway
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
