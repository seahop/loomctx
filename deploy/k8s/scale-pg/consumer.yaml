apiVersion: apps/v1
kind: Deployment
metadata:
  name: loom-consumer
  labels:
    app: loom-consumer
spec:
  # Writer consumers share one JetStream durable ("loom-writer"), so NATS
  # distributes messages across replicas — raise replicas if the queue
  # depth grows. Delivery is at-least-once; Postgres serializes the writes.
  replicas: 2
  selector:
    matchLabels:
      app: loom-consumer
  template:
    metadata:
      labels:
        app: loom-consumer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: consumer
          image: ghcr.io/seahop/loom:latest
          command: ["python", "-m", "loom.consumer"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: LOOM_DB
              valueFrom:
                secretKeyRef:
                  name: loom-db
                  key: LOOM_DB
            - name: LOOM_NATS_URL
              value: nats://nats:4222
            - name: LOOM_STREAM_REPLICAS
              value: "3"
            # --- auth (D-059): mount the same keys file the gateway uses so
            # the writer applies each sender's citation / supersession gates
            # (the gateway stamps the grant id on every message). Uncomment
            # with the gateway's block once the `loom-keys` Secret exists.
            # - name: LOOM_AUTH_FILE
            #   value: /etc/loom/keys.json
          volumeMounts:
            # - name: keys
            #   mountPath: /etc/loom
            #   readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
