# NATS JetStream as a 3-node cluster (D-029): the durable buffer between the
# gateways and the writer consumers survives the loss of any one node, and
# the ingest stream is replicated (LOOMCTX_STREAM_REPLICAS=3 on the gateway
# and consumer) so a message is acknowledged only once a quorum holds it.
# Clients use the headless Service; the client library discovers the rest.
# The monitor port (8222) is deliberately NOT on the Service: probes reach
# the pod directly and a scraper targets pods (see networkpolicy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app: nats
spec:
  clusterIP: None
  selector:
    app: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: cluster
      port: 6222
      targetPort: cluster
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    app: nats
spec:
  serviceName: nats
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: nats
  template:
    metadata:
      labels:
        app: nats
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nats
          image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true   # writes only under -sd /data
            capabilities:
              drop: [ALL]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          args:
            - "-js"
            - "-sd"
            - "/data"
            - "-m"
            - "8222"
            - "--server_name=$(POD_NAME)"
            - "--cluster_name=loomctx"
            - "--cluster=nats://0.0.0.0:6222"
            - "--routes=nats://nats-0.nats:6222,nats://nats-1.nats:6222,nats://nats-2.nats:6222"
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 6222
              name: cluster
            - containerPort: 8222
              name: monitor
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitor
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: monitor
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            # JetStream refuses a stream larger than its store: the gateway
            # asks for LOOMCTX_STREAM_MAX_BYTES (4 GiB) x LOOMCTX_STREAM_REPLICAS,
            # so the PVC must hold that plus headroom. A 1Gi claim only
            # worked on k3s because local-path reports the host disk; GKE
            # enforced it ("insufficient storage resources", D-043).
            storage: 8Gi
