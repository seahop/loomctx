apiVersion: apps/v1
kind: Deployment
metadata:
  name: loomctx
  labels:
    app: loomctx
spec:
  # Postgres-backed => stateless engine pods; the HPA below scales the read
  # path (ask/expand/answer) with load. No volume, no Recreate constraint.
  replicas: 2
  selector:
    matchLabels:
      app: loomctx
  template:
    metadata:
      labels:
        app: loomctx
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loomctx
          image: ghcr.io/seahop/loomctx:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: LOOMCTX_DB
              valueFrom:
                secretKeyRef:
                  name: loomctx-db
                  key: LOOMCTX_DB
            # Answering LLM (D-012) — add LOOMCTX_LLM_* here (from a Secret)
            # to enable /v1/answer.
            # Concurrency dials (D-028): 2 workers x 4 connections per pod;
            # add LOOMCTX_DB_READ (a replica DSN, e.g. the operator's -ro
            # Service) to move the read path off the primary.
            - name: LOOMCTX_WORKERS
              value: "2"
            - name: LOOMCTX_DB_POOL
              value: "4"
            # --- auth (D-013a / D-021): see base/deployment.yaml for the
            # LOOMCTX_AUTH_FILE / LOOMCTX_HANDLE_SECRET block and the keys mount.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /readyz     # probes Postgres reachability
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loomctx
  labels:
    app: loomctx
spec:
  selector:
    app: loomctx
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: loomctx
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: loomctx
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
