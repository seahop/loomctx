# Enrichment worker fleet (D-031): a StatefulSet so each replica knows its
# ordinal — the embedding backlog is split by LOOMCTX_WORKER_COUNT, and
# extraction / chunking / dossier work is leased per artifact or entity, so
# replicas never spend LLM budget on the same document twice. Scale by
# raising replicas and LOOMCTX_WORKER_COUNT together. Needs LOOMCTX_LLM_* /
# LOOMCTX_EMBED_* (from a Secret) to do anything; idle otherwise.
apiVersion: v1
kind: Service
metadata:
  name: loomctx-enrich
spec:
  clusterIP: None
  selector:
    app: loomctx-enrich
  ports:
    - name: none
      port: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loomctx-enrich
  labels:
    app: loomctx-enrich
spec:
  serviceName: loomctx-enrich
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: loomctx-enrich
  template:
    metadata:
      labels:
        app: loomctx-enrich
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enrich
          image: ghcr.io/seahop/loomctx:latest
          command: ["python", "-m", "loomctx.enrich", "run", "--interval", "30"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: LOOMCTX_DB
              valueFrom:
                secretKeyRef:
                  name: loomctx-db
                  key: LOOMCTX_DB
            - name: LOOMCTX_WORKER_COUNT
              value: "2"
            # - name: LOOMCTX_LLM_MODEL ... / LOOMCTX_EMBED_* from a Secret
            # Split pools (D-063): one tick runs every job in turn, so a slow
            # LLM pass holds up the embedding backlog. For a large backfill,
            # copy this StatefulSet as loomctx-enrich-vectors with
            # LOOMCTX_ENRICH_JOBS=vectors (embed, index, chunk: no LLM calls)
            # and set LOOMCTX_ENRICH_JOBS=llm,resolve here; give each its own
            # LOOMCTX_WORKER_COUNT. Default: every job.
            # - name: LOOMCTX_ENRICH_JOBS
            #   value: "llm,resolve"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
