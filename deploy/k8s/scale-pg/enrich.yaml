# Enrichment worker fleet (D-031): a StatefulSet so each replica knows its
# ordinal — the embedding backlog is split by LOOM_WORKER_COUNT, and
# extraction / chunking / dossier work is leased per artifact or entity, so
# replicas never spend LLM budget on the same document twice. Scale by
# raising replicas and LOOM_WORKER_COUNT together. Needs LOOM_LLM_* /
# LOOM_EMBED_* (from a Secret) to do anything; idle otherwise.
apiVersion: v1
kind: Service
metadata:
  name: loom-enrich
spec:
  clusterIP: None
  selector:
    app: loom-enrich
  ports:
    - name: none
      port: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loom-enrich
  labels:
    app: loom-enrich
spec:
  serviceName: loom-enrich
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: loom-enrich
  template:
    metadata:
      labels:
        app: loom-enrich
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: enrich
          image: ghcr.io/seahop/loom:latest
          command: ["python", "-m", "loom.enrich", "run", "--interval", "30"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: LOOM_DB
              valueFrom:
                secretKeyRef:
                  name: loom-db
                  key: LOOM_DB
            - name: LOOM_WORKER_COUNT
              value: "2"
            # - name: LOOM_LLM_MODEL ... / LOOM_EMBED_* from a Secret
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir: {}
