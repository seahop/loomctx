# CloudNativePG Cluster (D-030). The operator creates Services
# loomctx-pg-rw (primary), loomctx-pg-ro (replicas), loomctx-pg-r (any), and the
# Secret loomctx-pg-app (username/password/uri for the `loomctx` database).
# The operator's PostgreSQL images ship the pgvector extension, so the ANN
# index (D-025) is available; a plain image falls back to exact scans.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: loomctx-pg
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17
  primaryUpdateStrategy: unsupervised
  # How long a stopping primary waits for clients to disconnect before a fast
  # shutdown. The operator default is 180 s, and the replicas keep streaming
  # from the old primary until it is actually down, so with engines and
  # workers holding pooled connections a primary deletion (node drain, upgrade)
  # took 183 s to fail over on GKE; with 10 s the operator promotes in 13 s and
  # writes resume after 17 s (D-045). Writes in
  # flight at the cut are rolled back and retried by the queue.
  smartShutdownTimeout: 10
  bootstrap:
    initdb:
      database: loomctx
      owner: loomctx
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;
  storage:
    # Size for the corpus, not the demo: 465k observations with 512-dim
    # vectors is ~3.4 GB in SQLite and more in Postgres with the pgvector
    # index, plus WAL. 2Gi looked fine on k3s only because local-path
    # never enforces a claim; GKE did, and the cluster hit "Not enough disk
    # space" under load (D-043). Expandable online where the storage class
    # allows it (GKE standard-rwo does).
    size: 20Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
