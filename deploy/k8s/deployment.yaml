apiVersion: apps/v1
kind: Deployment
metadata:
  name: loom
  labels:
    app: loom
spec:
  # SQLite on an RWO volume => exactly one replica, and Recreate so upgrades
  # never run two writers. Scaling out = swapping in a server-backed
  # GraphStore (docs/decisions.md D-008); the pod spec doesn't change.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loom
  template:
    metadata:
      labels:
        app: loom
    spec:
      containers:
        - name: loom
          image: ghcr.io/seahop/loom:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: LOOM_DB
              value: /data/loom.db
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: loom-data
