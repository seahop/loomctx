# Local load balancer for the compose scale profile (D-010).
# The `resolver` + variable proxy_pass force per-request DNS resolution, so
# nginx round-robins across every replica of `docker compose up --scale
# gateway=N` without a config change.
events {}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8080;

        location / {
            set $upstream http://gateway:8080;
            proxy_pass $upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 30s;
        }
    }
}
