name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build engine image (shared by loom/test/consumer/mcp)
        run: docker compose build loom
      - name: Run Python test suite
        run: docker compose run --rm test
      - name: Contracts in sync (schemas.json + openapi.json regenerate identically)
        # image is pre-built above, so stdout carries only the JSON
        run: |
          docker compose run --rm -T loom python -m loom.schemas > /tmp/schemas.json
          diff /tmp/schemas.json contracts/schemas.json
          docker compose run --rm -T loom python -m loom.schemas openapi > /tmp/openapi.json
          diff /tmp/openapi.json contracts/openapi.json
      - name: OpenAPI generates clients cleanly (java + csharp, D-034)
        run: |
          docker run --rm -v "$PWD:/local" openapitools/openapi-generator-cli:v7.10.0 validate -i /local/contracts/openapi.json
          docker run --rm -v "$PWD:/local" openapitools/openapi-generator-cli:v7.10.0 generate -i /local/contracts/openapi.json -g java -o /tmp/gen-java >/dev/null
          docker run --rm -v "$PWD:/local" openapitools/openapi-generator-cli:v7.10.0 generate -i /local/contracts/openapi.json -g csharp -o /tmp/gen-csharp >/dev/null
      - name: Store tests against Postgres
        run: |
          docker compose --profile pg up -d --wait postgres
          docker compose run --rm \
            -e LOOM_TEST_POSTGRES_URL=postgresql://loom:loom@postgres:5432/loom \
            test pytest -q tests/test_store.py
      - name: Build gateway (go vet + go test run in the build)
        run: docker compose --profile scale build gateway
      - name: TypeScript + Go SDKs (generated types in sync, build, live tests)
        run: |
          docker compose up -d --wait loom
          docker compose --profile sdk run --rm sdk-ts
          docker compose --profile sdk run --rm sdk-go
          docker compose down

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/loom:latest
            ghcr.io/${{ github.repository_owner }}/loom:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/loom-gateway:latest
            ghcr.io/${{ github.repository_owner }}/loom-gateway:${{ github.sha }}
