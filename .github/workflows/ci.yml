name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build engine image (shared by loom/test/consumer/mcp)
        run: docker compose build loom
      - name: Run Python test suite
        run: docker compose run --rm test
      - name: Contracts in sync (schemas.json + openapi.json regenerate identically)
        # image is pre-built above, so stdout carries only the JSON
        run: |
          docker compose run --rm -T loom python -m loom.schemas > /tmp/schemas.json
          diff /tmp/schemas.json contracts/schemas.json
          docker compose run --rm -T loom python -m loom.schemas openapi > /tmp/openapi.json
          diff /tmp/openapi.json contracts/openapi.json
      - name: OpenAPI generates clients cleanly (java + csharp, D-034)
        run: |
          docker run --rm -v "$PWD:/local" openapitools/openapi-generator-cli:v7.10.0 validate -i /local/contracts/openapi.json
          docker run --rm -v "$PWD:/local" openapitools/openapi-generator-cli:v7.10.0 generate -i /local/contracts/openapi.json -g java -o /tmp/gen-java >/dev/null
          docker run --rm -v "$PWD:/local" openapitools/openapi-generator-cli:v7.10.0 generate -i /local/contracts/openapi.json -g csharp -o /tmp/gen-csharp >/dev/null
      - name: Store tests against Postgres
        run: |
          docker compose --profile pg up -d --wait postgres
          docker compose run --rm \
            -e LOOM_TEST_POSTGRES_URL=postgresql://loom:loom@postgres:5432/loom \
            test pytest -q tests/test_store.py
      - name: Build gateway (go vet + go test run in the build)
        run: docker compose --profile scale build gateway
      - name: TypeScript + Go SDKs (generated types in sync, build, live tests)
        run: |
          docker compose up -d --wait loom
          docker compose --profile sdk run --rm sdk-ts
          docker compose --profile sdk run --rm sdk-go
          docker compose down

  scale-smoke:
    # The scale shape end to end (D-045): lb -> 2 gateways -> JetStream -> consumer -> store -> engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: One claim through the queue and back out of the engine
        run: scripts/smoke-scale.sh

  python-matrix:
    # The image ships on the current stable Python (Dockerfile ARG); the
    # older interpreters the package still supports are checked here.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - name: Build on Python ${{ matrix.python }}
        run: docker build --build-arg PYTHON_VERSION=${{ matrix.python }} -t loom-py${{ matrix.python }} .
      - name: Test on Python ${{ matrix.python }}
        run: |
          docker run --rm -e LOOM_DB=/tmp/t.db -e PYTHONPATH=/app/sdk/python \
            -v "$PWD/tests:/app/tests:ro" -v "$PWD/sdk/python:/app/sdk/python:ro" \
            loom-py${{ matrix.python }} pytest -q

  publish-image:
    # main: build and push :latest + :<sha>. Tag push: re-tag the commit's already
    # published :<sha> image as :<tag> so the release image is byte-for-byte the one
    # that was gated (D-045); build only if that commit never went through main.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    needs: [test, scale-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Re-tag the published commit image as the release tag
        id: retag
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          o=ghcr.io/${{ github.repository_owner }}
          build=false
          for img in loom loom-gateway; do
            if docker buildx imagetools inspect "$o/$img:${{ github.sha }}" >/dev/null 2>&1; then
              docker buildx imagetools create -t "$o/$img:${{ github.ref_name }}" "$o/$img:${{ github.sha }}"
              echo "$img:${{ github.ref_name }} -> $(docker buildx imagetools inspect "$o/$img:${{ github.ref_name }}" --format '{{json .Manifest.Digest}}')"
            else
              echo "$o/$img:${{ github.sha }} was never published; building"; build=true
            fi
          done
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Image tags
        id: tags
        run: |
          o=ghcr.io/${{ github.repository_owner }}
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "engine=$o/loom:${{ github.sha }},$o/loom:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "gateway=$o/loom-gateway:${{ github.sha }},$o/loom-gateway:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "engine=$o/loom:latest,$o/loom:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "gateway=$o/loom-gateway:latest,$o/loom-gateway:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        if: github.ref_type != 'tag' || steps.retag.outputs.build == 'true'
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.engine }}
      - uses: docker/build-push-action@v6
        if: github.ref_type != 'tag' || steps.retag.outputs.build == 'true'
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.gateway }}
