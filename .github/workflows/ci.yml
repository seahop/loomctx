name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

# Least privilege by default; the jobs that push images say so themselves.
permissions:
  contents: read

# One run per branch/PR at a time: a newer push cancels the superseded run on
# PRs and feature branches. main and tags are never cancelled mid-flight — a
# half-finished run there could leave a pushed-but-unpromoted candidate.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# Actions are pinned to commit SHAs (Dependabot keeps them current); the
# version comment is what a human reads.

jobs:
  test:
    # Builds the ONE engine image and the ONE gateway image everything else
    # tests. On a push, each is built and pushed as a candidate
    # (ghcr.io/<owner>/<image>:ci-<sha>, with SBOM + provenance attestations)
    # and then pulled back BY DIGEST for the tests, so what publish-image
    # later promotes is byte-for-byte what passed here. On a pull request
    # there is nothing to push, so the build is loaded locally instead.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      ENGINE: ghcr.io/${{ github.repository_owner }}/loomctx
      GATEWAY: ghcr.io/${{ github.repository_owner }}/loomctx-gateway
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # --- engine image ---------------------------------------------------
      - name: Build + push the engine candidate (push events)
        id: engine-push
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ env.ENGINE }}:ci-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
      - name: Pull the engine candidate back by digest as loomctx-engine:local
        if: github.event_name == 'push'
        run: |
          docker pull "$ENGINE@${{ steps.engine-push.outputs.digest }}"
          docker tag "$ENGINE@${{ steps.engine-push.outputs.digest }}" loomctx-engine:local
      - name: Build the engine image locally (pull requests)
        if: github.event_name != 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          tags: loomctx-engine:local
          cache-from: type=gha,scope=engine

      # --- gateway image --------------------------------------------------
      - name: Build + push the gateway candidate (push events; go vet/test/govulncheck run inside)
        id: gateway-push
        if: github.event_name == 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: gateway/Dockerfile
          push: true
          tags: ${{ env.GATEWAY }}:ci-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Pull the gateway candidate back by digest as loomctx-gateway:local
        if: github.event_name == 'push'
        run: |
          docker pull "$GATEWAY@${{ steps.gateway-push.outputs.digest }}"
          docker tag "$GATEWAY@${{ steps.gateway-push.outputs.digest }}" loomctx-gateway:local
      - name: Build the gateway image locally (pull requests)
        if: github.event_name != 'push'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: gateway/Dockerfile
          load: true
          tags: loomctx-gateway:local
          cache-from: type=gha,scope=gateway

      # --- the suite, against those two images ----------------------------
      - name: Run Python test suite
        run: docker compose run --rm test
      - name: Contracts in sync (schemas.json + openapi.json regenerate identically)
        # image is pre-built above, so stdout carries only the JSON
        run: |
          docker compose run --rm -T loomctx python -m loomctx.schemas > /tmp/schemas.json
          diff /tmp/schemas.json contracts/schemas.json
          docker compose run --rm -T loomctx python -m loomctx.schemas openapi > /tmp/openapi.json
          diff /tmp/openapi.json contracts/openapi.json
      - name: OpenAPI generates clients cleanly (java + csharp, D-034)
        env:
          # pinned by digest like every other third-party image (tag kept for humans)
          OPENAPI_GEN: openapitools/openapi-generator-cli:v7.10.0@sha256:f2054a5a7908ad81017d0f0839514ba5eab06ae628914ff71554d46fac1bcf7a
        run: |
          docker run --rm -v "$PWD:/local" "$OPENAPI_GEN" validate -i /local/contracts/openapi.json
          docker run --rm -v "$PWD:/local" "$OPENAPI_GEN" generate -i /local/contracts/openapi.json -g java -o /tmp/gen-java >/dev/null
          docker run --rm -v "$PWD:/local" "$OPENAPI_GEN" generate -i /local/contracts/openapi.json -g csharp -o /tmp/gen-csharp >/dev/null
      - name: Store tests against Postgres
        run: |
          docker compose --profile pg up -d --wait postgres
          docker compose run --rm \
            -e LOOMCTX_TEST_POSTGRES_URL=postgresql://loomctx:loomctx@postgres:5432/loomctx \
            test pytest -q tests/test_store.py
      - name: TypeScript + Go SDKs (generated types in sync, build, live tests)
        run: |
          docker compose up -d --wait loomctx
          docker compose --profile sdk run --rm sdk-ts
          docker compose --profile sdk run --rm sdk-go
          docker compose down

  lint:
    # Hard errors only (syntax, undefined names) — the rule set lives in
    # pyproject.toml [tool.ruff]. Ruff runs from its own image, pinned by digest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: ruff check
        run: |
          docker run --rm -v "$PWD:/w:ro" -w /w \
            ghcr.io/astral-sh/ruff:0.16.8@sha256:ec3c84a063840fc9a678004f4d958ea4e1e79de1ee3f94dc0f0df3a4a3a1f1a7 \
            check --no-cache .
      - name: License files in every published package match the root
        # each SDK ships on its own (pkg.go.dev hides docs without a LICENSE)
        run: |
          for d in sdk/go sdk/python sdk/typescript; do
            cmp LICENSE "$d/LICENSE"
            cmp NOTICE "$d/NOTICE"
          done

  scale-smoke:
    # The scale shape end to end (D-045): lb -> 2 gateways -> JetStream -> consumer -> store -> engine.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: One claim through the queue and back out of the engine
        run: scripts/smoke-scale.sh

  python-matrix:
    # The image ships on the current stable Python (Dockerfile ARG, pinned by
    # digest); the older interpreters the package still supports are checked
    # here by tag (an empty PYTHON_DIGEST lets the tag resolve on its own).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Build on Python ${{ matrix.python }}
        run: docker build --build-arg PYTHON_VERSION=${{ matrix.python }} --build-arg PYTHON_DIGEST= -t loomctx-py${{ matrix.python }} .
      - name: Test on Python ${{ matrix.python }}
        run: |
          docker run --rm -e LOOMCTX_DB=/tmp/t.db -e PYTHONPATH=/app/sdk/python \
            -v "$PWD/tests:/app/tests:ro" -v "$PWD/sdk/python:/app/sdk/python:ro" \
            loomctx-py${{ matrix.python }} pytest -q

  publish-image:
    # Nothing is built here. main: the candidates the test job pushed and
    # tested (:ci-<sha>) are scanned and promoted to :latest + :<sha> with
    # `imagetools create` — a manifest re-tag, so the published image IS the
    # tested one. Tag push: the commit's :<sha> (already gated on main) is
    # promoted to :<tag>; if the commit never went through main, this run's
    # own :ci-<sha> candidate is used instead (D-045).
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
    needs: [test, lint, scale-smoke, python-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      OWNER: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pick the candidate to promote
        id: pick
        run: |
          set -euo pipefail
          for img in loomctx loomctx-gateway; do
            src="$OWNER/$img:ci-${{ github.sha }}"
            if [ "${{ github.ref_type }}" = tag ] && docker buildx imagetools inspect "$OWNER/$img:${{ github.sha }}" >/dev/null 2>&1; then
              src="$OWNER/$img:${{ github.sha }}"   # gated on main already
            fi
            docker buildx imagetools inspect "$src" >/dev/null
            echo "$img=$src" >> "$GITHUB_OUTPUT"
            echo "$img <- $src"
          done
      - name: Trivy — engine candidate (CRITICAL/HIGH with a fix available fail the publish)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.pick.outputs.loomctx }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy — gateway candidate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.pick.outputs.loomctx-gateway }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Promote (manifest re-tag; no rebuild)
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = tag ]; then
            tags="${{ github.ref_name }}"
          else
            tags="latest ${{ github.sha }}"
          fi
          for img in loomctx loomctx-gateway; do
            if [ "$img" = loomctx ]; then src="${{ steps.pick.outputs.loomctx }}"; else src="${{ steps.pick.outputs.loomctx-gateway }}"; fi
            args=""
            for t in $tags; do args="$args -t $OWNER/$img:$t"; done
            docker buildx imagetools create $args "$src"
            for t in $tags; do
              echo "$img:$t -> $(docker buildx imagetools inspect "$OWNER/$img:$t" --format '{{json .Manifest.Digest}}')"
            done
          done
