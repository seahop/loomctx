[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loom-ctx"
version = "0.1.0"
description = "Loom (working name): a context engine for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]
scale = [
    "nats-py>=2.7",
]
postgres = [
    "psycopg[binary]>=3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
