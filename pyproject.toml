[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loom-ctx"
version = "0.1.0"
description = "Loom (working name): a context engine for AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "seahop" }]
keywords = ["agents", "context", "mcp", "provenance", "knowledge-graph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "prometheus-client>=0.20",
]

[project.urls]
Homepage = "https://github.com/seahop/Loom"
Documentation = "https://github.com/seahop/Loom/tree/main/docs"
Issues = "https://github.com/seahop/Loom/issues"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
]
scale = [
    "nats-py>=2.7",
]
postgres = [
    "psycopg[binary,pool]>=3.2",
]
mcp = [
    "mcp>=2",
]
vector = [
    "numpy>=1.26",       # batched cosine; pure Python without it
    "sqlite-vec>=0.1.6", # ANN index for the SQLite store; exact scan without it
]
s3 = [
    "boto3>=1.34",       # artifact offload to S3-compatible storage (D-033)
]
kafka = [
    "aiokafka>=0.11",    # consume envelopes from your Kafka/Redpanda topics (D-034)
    "python-snappy>=0.7", # the codecs producers commonly use (Redpanda defaults to snappy)
    "lz4>=4.3",
    "zstandard>=0.22",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
