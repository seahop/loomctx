services:
  # LOOM_DB is a SQLite path by default; point it at postgresql://... to use
  # the server-backed store instead (D-011), e.g.:
  #   LOOM_DB=postgresql://loom:loom@postgres:5432/loom \
  #     docker compose --profile pg up -d loom postgres
  # All engine-based services (loom, test, consumer, mcp) share ONE image so
  # they can never drift apart — `docker compose build loom` refreshes them all.
  # Ports bind to localhost unless LOOM_BIND says otherwise (.env.example).
  # Third-party images are pinned by digest; Dependabot bumps them.
  loom:
    build: .
    image: loom-engine:local
    restart: unless-stopped
    ports:
      - "${LOOM_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - loom-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    environment:
      LOOM_DB: ${LOOM_DB:-/data/loom.db}
      # Answering LLM (D-012): any OpenAI-compatible provider or self-hosted
      # endpoint, or provider=anthropic. Unset => /v1/answer returns 503.
      LOOM_LLM_MODEL: ${LOOM_LLM_MODEL:-}
      LOOM_LLM_PROVIDER: ${LOOM_LLM_PROVIDER:-}
      LOOM_LLM_BASE_URL: ${LOOM_LLM_BASE_URL:-}
      LOOM_LLM_API_KEY: ${LOOM_LLM_API_KEY:-}
      LOOM_EMBED_PROVIDER: ${LOOM_EMBED_PROVIDER:-}
      LOOM_EMBED_BASE_URL: ${LOOM_EMBED_BASE_URL:-}
      LOOM_EMBED_MODEL: ${LOOM_EMBED_MODEL:-}
      LOOM_EMBED_API_KEY: ${LOOM_EMBED_API_KEY:-}
      LOOM_EMBED_DIM: ${LOOM_EMBED_DIM:-}
      LOOM_EMBED_BATCH: ${LOOM_EMBED_BATCH:-}
      LOOM_EMBED_QUERY_TIMEOUT: ${LOOM_EMBED_QUERY_TIMEOUT:-}
      LOOM_API_KEYS: ${LOOM_API_KEYS:-}
      LOOM_AUTH_FILE: ${LOOM_AUTH_FILE:-}
      LOOM_MAX_BUDGET: ${LOOM_MAX_BUDGET:-}
      LOOM_MAX_BODY_BYTES: ${LOOM_MAX_BODY_BYTES:-}
      LOOM_HANDLE_SECRET: ${LOOM_HANDLE_SECRET:-}
      # The stdio MCP server (`docker compose run --rm -T loom python -m
      # loom.mcp_server`), `loom.agent_eval` and `loom.enrich resolve` all run
      # from THIS service via run/exec, so their dials ride along here.
      LOOM_MCP_NAMESPACE: ${LOOM_MCP_NAMESPACE:-}
      LOOM_AGENT_MODEL: ${LOOM_AGENT_MODEL:-}
      LOOM_AGENT_MAX_STEPS: ${LOOM_AGENT_MAX_STEPS:-}
      LOOM_ALIAS_TYPES: ${LOOM_ALIAS_TYPES:-}
      # Postgres-shape concurrency dials (D-028); ignored on SQLite
      LOOM_WORKERS: ${LOOM_WORKERS:-}
      LOOM_DB_POOL: ${LOOM_DB_POOL:-}
      LOOM_DB_READ: ${LOOM_DB_READ:-}
      LOOM_SHARDS: ${LOOM_SHARDS:-}
      LOOM_BLOB_THRESHOLD: ${LOOM_BLOB_THRESHOLD:-}
      LOOM_BLOB_DIR: ${LOOM_BLOB_DIR:-}
      LOOM_BLOB_S3_BUCKET: ${LOOM_BLOB_S3_BUCKET:-}
      LOOM_BLOB_S3_ENDPOINT: ${LOOM_BLOB_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

  test:
    image: loom-engine:local
    profiles: ["test"]
    environment:
      LOOM_DB: /tmp/loom-test.db
      PYTHONPATH: /app/sdk/python
      # from .env when present — lets the e2e answer test hit a real provider
      LOOM_LLM_MODEL: ${LOOM_LLM_MODEL:-}
      LOOM_LLM_PROVIDER: ${LOOM_LLM_PROVIDER:-}
      LOOM_LLM_BASE_URL: ${LOOM_LLM_BASE_URL:-}
      LOOM_LLM_API_KEY: ${LOOM_LLM_API_KEY:-}
    volumes:
      - ./tests:/app/tests:ro
      - ./sdk/python:/app/sdk/python:ro   # the SDK is tested against a live engine
    command: pytest -q

  # ------------------------------------------------------------------------
  # Scale shape (D-010): devices -> lb :8081 -> N gateways -> NATS -> writer
  # consumer -> shared store. Start with:
  #   docker compose --profile scale up -d --build --scale gateway=3
  # The read path stays on the loom service (:8000).
  # ------------------------------------------------------------------------

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: loom-gateway:local
    profiles: ["scale"]
    restart: unless-stopped
    environment:
      LOOM_NATS_URL: nats://nats:4222
      LOOM_API_KEYS: ${LOOM_API_KEYS:-}
      LOOM_AUTH_FILE: ${LOOM_AUTH_FILE:-}
      # stream shape (D-029): single-node NATS here, so replicas stay 1;
      # cap the buffer so an ingestion storm degrades predictably
      LOOM_STREAM_REPLICAS: ${LOOM_STREAM_REPLICAS:-1}
      LOOM_STREAM_MAX_BYTES: ${LOOM_STREAM_MAX_BYTES:-1073741824}
      LOOM_STREAM_DISCARD: ${LOOM_STREAM_DISCARD:-old}
    depends_on:
      nats:
        condition: service_healthy

  lb:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    profiles: ["scale"]
    restart: unless-stopped
    ports:
      - "${LOOM_BIND:-127.0.0.1}:8081:8080"
    volumes:
      - ./deploy/compose/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    profiles: ["scale"]
    restart: unless-stopped
    # JetStream on a volume so the queue survives a restart (at-least-once
    # means nothing if the buffer is ephemeral); monitor port for health
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 20

  consumer:
    image: loom-engine:local
    healthcheck:
      disable: true    # no HTTP port here; the image's readyz check doesn't apply
    profiles: ["scale"]
    restart: unless-stopped
    command: python -m loom.consumer
    environment:
      LOOM_DB: ${LOOM_DB:-/data/loom.db}
      LOOM_NATS_URL: nats://nats:4222
      # redelivery + dead-letter dials (D-029)
      LOOM_STREAM_REPLICAS: ${LOOM_STREAM_REPLICAS:-1}
      LOOM_ACK_WAIT: ${LOOM_ACK_WAIT:-}
      LOOM_MAX_DELIVER: ${LOOM_MAX_DELIVER:-}
      LOOM_DEADLETTER_MAX_BYTES: ${LOOM_DEADLETTER_MAX_BYTES:-}
    volumes:
      - loom-data:/data
    depends_on:
      nats:
        condition: service_healthy

  # Kafka / Redpanda writer consumer (D-034): reads envelopes from topics your
  # pipelines already publish to. Point it at your brokers; a Redpanda for
  # local trial ships in the same profile.
  #   docker compose --profile kafka up -d
  # NOTE: the broker credentials below authenticate Loom TO the broker; there
  # is no per-message principal on this path — anyone who can produce to the
  # topic writes into any namespace. Topic ACLs are the write permission.
  kafka-consumer:
    image: loom-engine:local
    healthcheck:
      disable: true    # no HTTP port here; the image's readyz check doesn't apply
    profiles: ["kafka"]
    restart: unless-stopped
    command: python -m loom.kafka_consumer
    environment:
      LOOM_DB: ${LOOM_DB:-/data/loom.db}
      LOOM_KAFKA_BROKERS: ${LOOM_KAFKA_BROKERS:-redpanda:9092}
      LOOM_KAFKA_TOPICS: ${LOOM_KAFKA_TOPICS:-loom.ingest}
      LOOM_KAFKA_GROUP: ${LOOM_KAFKA_GROUP:-loom-writer}
      LOOM_KAFKA_DEADLETTER: ${LOOM_KAFKA_DEADLETTER:-}
      LOOM_MAX_DELIVER: ${LOOM_MAX_DELIVER:-}
      LOOM_KAFKA_SECURITY_PROTOCOL: ${LOOM_KAFKA_SECURITY_PROTOCOL:-}
      LOOM_KAFKA_SASL_MECHANISM: ${LOOM_KAFKA_SASL_MECHANISM:-}
      LOOM_KAFKA_SASL_USERNAME: ${LOOM_KAFKA_SASL_USERNAME:-}
      LOOM_KAFKA_SASL_PASSWORD: ${LOOM_KAFKA_SASL_PASSWORD:-}
      LOOM_KAFKA_SSL_CAFILE: ${LOOM_KAFKA_SSL_CAFILE:-}
    volumes:
      - loom-data:/data
    depends_on:
      redpanda:
        condition: service_healthy

  redpanda:
    image: redpandadata/redpanda:v24.2.7@sha256:82a69763bef8d8b55ea5a520fa1b38f993908ef68946819ca1aed43541824c48
    profiles: ["kafka"]
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "512M",
              "--reserve-memory", "0M", "--node-id", "0", "--check=false",
              "--kafka-addr", "PLAINTEXT://0.0.0.0:9092", "--advertise-kafka-addr", "PLAINTEXT://redpanda:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Enrichment worker (D-018): embeddings + document claim extraction +
  # dossiers + entity resolution. One-shot drain: docker compose run --rm enrich
  #   python -m loom.enrich run --once
  enrich:
    image: loom-engine:local
    healthcheck:
      disable: true    # no HTTP port here; the image's readyz check doesn't apply
    profiles: ["enrich"]
    command: python -m loom.enrich run --interval 30
    restart: unless-stopped
    volumes:
      - loom-data:/data
    environment:
      LOOM_DB: ${LOOM_DB:-/data/loom.db}
      LOOM_LLM_MODEL: ${LOOM_LLM_MODEL:-}
      LOOM_LLM_PROVIDER: ${LOOM_LLM_PROVIDER:-}
      LOOM_LLM_BASE_URL: ${LOOM_LLM_BASE_URL:-}
      LOOM_LLM_API_KEY: ${LOOM_LLM_API_KEY:-}
      LOOM_EMBED_PROVIDER: ${LOOM_EMBED_PROVIDER:-}
      LOOM_EMBED_BASE_URL: ${LOOM_EMBED_BASE_URL:-}
      LOOM_EMBED_MODEL: ${LOOM_EMBED_MODEL:-}
      LOOM_EMBED_API_KEY: ${LOOM_EMBED_API_KEY:-}
      LOOM_EMBED_DIM: ${LOOM_EMBED_DIM:-}
      LOOM_EMBED_BATCH: ${LOOM_EMBED_BATCH:-}
      # worker dials (D-039 / D-042)
      LOOM_CHUNK_LIMIT: ${LOOM_CHUNK_LIMIT:-}
      LOOM_ALIAS_TYPES: ${LOOM_ALIAS_TYPES:-}

  # MCP over streamable HTTP for remote agents. Local agents spawn stdio
  # instead: claude mcp add loom -- docker compose run --rm -T loom
  #   python -m loom.mcp_server
  # Auth (D-024): with LOOM_AUTH_FILE / LOOM_API_KEYS set, every request on
  # this transport must carry the same X-Loom-Key / Bearer header as the
  # REST API, and each tool call is scoped by that key's grants. Unset =
  # open dev mode, which is why the port binds to localhost by default.
  mcp:
    image: loom-engine:local
    profiles: ["mcp"]
    restart: unless-stopped
    command: python -m loom.mcp_server --transport streamable-http --host 0.0.0.0 --port 8300
    ports:
      - "${LOOM_BIND:-127.0.0.1}:8300:8300"
    volumes:
      - loom-data:/data
    environment:
      LOOM_DB: ${LOOM_DB:-/data/loom.db}
      LOOM_MCP_NAMESPACE: ${LOOM_MCP_NAMESPACE:-}
      LOOM_LLM_MODEL: ${LOOM_LLM_MODEL:-}
      LOOM_LLM_PROVIDER: ${LOOM_LLM_PROVIDER:-}
      LOOM_LLM_BASE_URL: ${LOOM_LLM_BASE_URL:-}
      LOOM_LLM_API_KEY: ${LOOM_LLM_API_KEY:-}
      # find_related and semantic ranking need the same embedder the
      # worker used; without this block that tool always errors here
      LOOM_EMBED_PROVIDER: ${LOOM_EMBED_PROVIDER:-}
      LOOM_EMBED_BASE_URL: ${LOOM_EMBED_BASE_URL:-}
      LOOM_EMBED_MODEL: ${LOOM_EMBED_MODEL:-}
      LOOM_EMBED_API_KEY: ${LOOM_EMBED_API_KEY:-}
      LOOM_EMBED_DIM: ${LOOM_EMBED_DIM:-}
      LOOM_EMBED_QUERY_TIMEOUT: ${LOOM_EMBED_QUERY_TIMEOUT:-}
      LOOM_API_KEYS: ${LOOM_API_KEYS:-}
      LOOM_AUTH_FILE: ${LOOM_AUTH_FILE:-}
      LOOM_MAX_BUDGET: ${LOOM_MAX_BUDGET:-}
      LOOM_HANDLE_SECRET: ${LOOM_HANDLE_SECRET:-}

  # TypeScript SDK toolchain (D-026): regen-check the generated contract
  # types, build, and run the client test against the live engine.
  #   docker compose --profile sdk run --rm sdk-ts
  sdk-ts:
    build:
      context: .
      dockerfile: sdk/typescript/Dockerfile
    profiles: ["sdk"]
    environment:
      LOOM_URL: http://loom:8000
    volumes:
      - ./sdk/typescript/src:/app/src        # so `npm run gen` writes back
      - ./contracts:/contracts:ro
    depends_on:
      loom:
        condition: service_healthy

  # Go SDK toolchain (D-034): vet, contract drift test, live test.
  #   docker compose --profile sdk run --rm sdk-go
  sdk-go:
    build:
      context: .
      dockerfile: sdk/go/Dockerfile
    profiles: ["sdk"]
    environment:
      LOOM_URL: http://loom:8000
    volumes:
      - ./contracts:/contracts:ro
    depends_on:
      loom:
        condition: service_healthy

  # Server-backed store for the database-scaling lane (D-011).
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f   # postgres 17 + the vector extension (D-025)
    profiles: ["pg"]
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pg-data:/var/lib/postgresql/data

  # A graph database (Neo4j) is a POSSIBLE GraphStore backend, not a shipped
  # one: nothing in the repo implements it (docs/decisions.md D-002,
  # docs/roadmap.md phase 5). If it is ever written, it would slot in here
  # as another profile the same way postgres does.

volumes:
  loom-data:
  nats-data:
  pg-data:
