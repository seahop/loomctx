# Fixed project name: volumes and containers are loomctx_* whatever the
# checkout folder is called (D-088).
name: loomctx

services:
  # LOOMCTX_DB is a SQLite path by default; point it at postgresql://... to use
  # the server-backed store instead (D-011), e.g.:
  #   LOOMCTX_DB=postgresql://loomctx:loomctx@postgres:5432/loomctx \
  #     docker compose --profile pg up -d loomctx postgres
  # All engine-based services (loomctx, test, consumer, kafka-consumer, enrich,
  # mcp) share ONE image so they can never drift apart — `docker compose build
  # loomctx` refreshes them all. Each also carries `build: .` so a fresh clone can
  # start with any of them (e.g. `docker compose run --rm test`) and compose
  # builds the image instead of trying to pull loomctx-engine:local.
  # Ports bind to localhost unless LOOMCTX_BIND says otherwise (.env.example).
  # Third-party images are pinned by digest; Dependabot bumps them.
  loomctx:
    build: .
    image: loomctx-engine:local
    restart: unless-stopped
    ports:
      - "${LOOMCTX_BIND:-127.0.0.1}:8000:8000"
    volumes:
      - loomctx-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 5s
    environment:
      LOOMCTX_DB: ${LOOMCTX_DB:-/data/loomctx.db}
      # Answering LLM (D-012): any OpenAI-compatible provider or self-hosted
      # endpoint, or provider=anthropic. Unset => /v1/answer returns 503.
      LOOMCTX_LLM_MODEL: ${LOOMCTX_LLM_MODEL:-}
      LOOMCTX_LLM_PROVIDER: ${LOOMCTX_LLM_PROVIDER:-}
      LOOMCTX_LLM_BASE_URL: ${LOOMCTX_LLM_BASE_URL:-}
      LOOMCTX_LLM_API_KEY: ${LOOMCTX_LLM_API_KEY:-}
      LOOMCTX_EMBED_PROVIDER: ${LOOMCTX_EMBED_PROVIDER:-}
      LOOMCTX_EMBED_BASE_URL: ${LOOMCTX_EMBED_BASE_URL:-}
      LOOMCTX_EMBED_MODEL: ${LOOMCTX_EMBED_MODEL:-}
      LOOMCTX_EMBED_API_KEY: ${LOOMCTX_EMBED_API_KEY:-}
      LOOMCTX_EMBED_DIM: ${LOOMCTX_EMBED_DIM:-}
      LOOMCTX_EMBED_BATCH: ${LOOMCTX_EMBED_BATCH:-}
      LOOMCTX_EMBED_QUERY_TIMEOUT: ${LOOMCTX_EMBED_QUERY_TIMEOUT:-}
      LOOMCTX_API_KEYS: ${LOOMCTX_API_KEYS:-}
      LOOMCTX_AUTH_FILE: ${LOOMCTX_AUTH_FILE:-}
      LOOMCTX_MAX_BUDGET: ${LOOMCTX_MAX_BUDGET:-}
      LOOMCTX_MAX_BODY_BYTES: ${LOOMCTX_MAX_BODY_BYTES:-}
      LOOMCTX_MAX_BATCH: ${LOOMCTX_MAX_BATCH:-}
      LOOMCTX_HANDLE_SECRET: ${LOOMCTX_HANDLE_SECRET:-}
      # per-key rate limits (R-10, D-059); unset = unlimited. Per process:
      # the ceiling is rate x LOOMCTX_WORKERS x replicas (docs/administration.md)
      LOOMCTX_RATE_PER_SEC: ${LOOMCTX_RATE_PER_SEC:-}
      LOOMCTX_RATE_BURST: ${LOOMCTX_RATE_BURST:-}
      LOOMCTX_RATE_LLM_PER_SEC: ${LOOMCTX_RATE_LLM_PER_SEC:-}
      LOOMCTX_RATE_LLM_BURST: ${LOOMCTX_RATE_LLM_BURST:-}
      # Host / Origin allowlist (D-059): localhost, IPs and service names
      # always pass; add the public name you serve LoomCtx under
      LOOMCTX_ALLOWED_HOSTS: ${LOOMCTX_ALLOWED_HOSTS:-}
      LOOMCTX_ALLOWED_ORIGINS: ${LOOMCTX_ALLOWED_ORIGINS:-}
      # The stdio MCP server (`docker compose run --rm -T loomctx python -m
      # loomctx.mcp_server`), `loomctx.agent_eval` and `loomctx.enrich resolve` all run
      # from THIS service via run/exec, so their dials ride along here.
      LOOMCTX_MCP_NAMESPACE: ${LOOMCTX_MCP_NAMESPACE:-}
      # record_claim / run_query on the MCP surface; 0 hides the tool (docs/mcp-clients.md)
      LOOMCTX_MCP_WRITES: ${LOOMCTX_MCP_WRITES:-}
      LOOMCTX_MCP_QUERIES: ${LOOMCTX_MCP_QUERIES:-}
      LOOMCTX_AGENT_MODEL: ${LOOMCTX_AGENT_MODEL:-}
      LOOMCTX_AGENT_MAX_STEPS: ${LOOMCTX_AGENT_MAX_STEPS:-}
      LOOMCTX_ALIAS_TYPES: ${LOOMCTX_ALIAS_TYPES:-}
      # Postgres-shape concurrency dials (D-028); ignored on SQLite
      LOOMCTX_WORKERS: ${LOOMCTX_WORKERS:-}
      LOOMCTX_DB_POOL: ${LOOMCTX_DB_POOL:-}
      LOOMCTX_DB_READ: ${LOOMCTX_DB_READ:-}
      LOOMCTX_SHARDS: ${LOOMCTX_SHARDS:-}
      LOOMCTX_BLOB_THRESHOLD: ${LOOMCTX_BLOB_THRESHOLD:-}
      LOOMCTX_BLOB_DIR: ${LOOMCTX_BLOB_DIR:-}
      LOOMCTX_BLOB_S3_BUCKET: ${LOOMCTX_BLOB_S3_BUCKET:-}
      LOOMCTX_BLOB_S3_ENDPOINT: ${LOOMCTX_BLOB_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

  test:
    build: .
    image: loomctx-engine:local
    profiles: ["test"]
    environment:
      LOOMCTX_DB: /tmp/loomctx-test.db
      PYTHONPATH: /app/sdk/python
      # from .env when present — lets the e2e answer test hit a real provider
      LOOMCTX_LLM_MODEL: ${LOOMCTX_LLM_MODEL:-}
      LOOMCTX_LLM_PROVIDER: ${LOOMCTX_LLM_PROVIDER:-}
      LOOMCTX_LLM_BASE_URL: ${LOOMCTX_LLM_BASE_URL:-}
      LOOMCTX_LLM_API_KEY: ${LOOMCTX_LLM_API_KEY:-}
    volumes:
      - ./tests:/app/tests:ro
      - ./sdk/python:/app/sdk/python:ro   # the SDK is tested against a live engine
    command: pytest -q

  # ------------------------------------------------------------------------
  # Scale shape (D-010): devices -> lb :8081 -> N gateways -> NATS -> writer
  # consumer -> shared store. Start with:
  #   docker compose --profile scale up -d --build --scale gateway=3
  # The read path stays on the loomctx service (:8000).
  # ------------------------------------------------------------------------

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    image: loomctx-gateway:local
    profiles: ["scale"]
    restart: unless-stopped
    environment:
      LOOMCTX_NATS_URL: nats://nats:4222
      LOOMCTX_API_KEYS: ${LOOMCTX_API_KEYS:-}
      LOOMCTX_AUTH_FILE: ${LOOMCTX_AUTH_FILE:-}
      # per-key rate limit (a batch of n costs n) and Host / Origin
      # allowlist, same dials and meaning as the engine (D-059)
      LOOMCTX_RATE_PER_SEC: ${LOOMCTX_RATE_PER_SEC:-}
      LOOMCTX_RATE_BURST: ${LOOMCTX_RATE_BURST:-}
      LOOMCTX_MAX_BATCH: ${LOOMCTX_MAX_BATCH:-}
      LOOMCTX_ALLOWED_HOSTS: ${LOOMCTX_ALLOWED_HOSTS:-}
      LOOMCTX_ALLOWED_ORIGINS: ${LOOMCTX_ALLOWED_ORIGINS:-}
      # stream shape (D-029): single-node NATS here, so replicas stay 1;
      # cap the buffer so an ingestion storm degrades predictably
      LOOMCTX_STREAM_REPLICAS: ${LOOMCTX_STREAM_REPLICAS:-1}
      LOOMCTX_STREAM_MAX_BYTES: ${LOOMCTX_STREAM_MAX_BYTES:-1073741824}
      LOOMCTX_STREAM_DISCARD: ${LOOMCTX_STREAM_DISCARD:-old}
    depends_on:
      nats:
        condition: service_healthy

  lb:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    profiles: ["scale"]
    restart: unless-stopped
    ports:
      - "${LOOMCTX_BIND:-127.0.0.1}:8081:8080"
    volumes:
      - ./deploy/compose/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway

  nats:
    image: nats:2.10-alpine@sha256:b83efabe3e7def1e0a4a31ec6e078999bb17c80363f881df35edc70fcb6bb927
    profiles: ["scale"]
    restart: unless-stopped
    # JetStream on a volume so the queue survives a restart (at-least-once
    # means nothing if the buffer is ephemeral); monitor port for health
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 20

  consumer:
    build: .
    image: loomctx-engine:local
    healthcheck:
      disable: true    # no HTTP port here; the image's readyz check doesn't apply
    profiles: ["scale"]
    restart: unless-stopped
    command: python -m loomctx.consumer
    environment:
      LOOMCTX_DB: ${LOOMCTX_DB:-/data/loomctx.db}
      LOOMCTX_NATS_URL: nats://nats:4222
      # redelivery + dead-letter dials (D-029)
      LOOMCTX_STREAM_REPLICAS: ${LOOMCTX_STREAM_REPLICAS:-1}
      LOOMCTX_ACK_WAIT: ${LOOMCTX_ACK_WAIT:-}
      LOOMCTX_MAX_DELIVER: ${LOOMCTX_MAX_DELIVER:-}
      LOOMCTX_DEADLETTER_MAX_BYTES: ${LOOMCTX_DEADLETTER_MAX_BYTES:-}
      # the gateway's keys, so queued claims get the sender's write gates (D-059)
      LOOMCTX_API_KEYS: ${LOOMCTX_API_KEYS:-}
      LOOMCTX_AUTH_FILE: ${LOOMCTX_AUTH_FILE:-}
    volumes:
      - loomctx-data:/data
    depends_on:
      nats:
        condition: service_healthy

  # Kafka / Redpanda writer consumer (D-034): reads envelopes from topics your
  # pipelines already publish to. Point it at your brokers; a Redpanda for
  # local trial ships in the same profile.
  #   docker compose --profile kafka up -d
  # NOTE: the broker credentials below authenticate LoomCtx TO the broker; there
  # is no per-message principal on this path — anyone who can produce to the
  # topic writes into any namespace. Topic ACLs are the write permission.
  kafka-consumer:
    build: .
    image: loomctx-engine:local
    healthcheck:
      disable: true    # no HTTP port here; the image's readyz check doesn't apply
    profiles: ["kafka"]
    restart: unless-stopped
    command: python -m loomctx.kafka_consumer
    environment:
      LOOMCTX_DB: ${LOOMCTX_DB:-/data/loomctx.db}
      LOOMCTX_KAFKA_BROKERS: ${LOOMCTX_KAFKA_BROKERS:-redpanda:9092}
      LOOMCTX_KAFKA_TOPICS: ${LOOMCTX_KAFKA_TOPICS:-loomctx.ingest}
      LOOMCTX_KAFKA_GROUP: ${LOOMCTX_KAFKA_GROUP:-loomctx-writer}
      LOOMCTX_KAFKA_DEADLETTER: ${LOOMCTX_KAFKA_DEADLETTER:-}
      LOOMCTX_MAX_DELIVER: ${LOOMCTX_MAX_DELIVER:-}
      LOOMCTX_KAFKA_SECURITY_PROTOCOL: ${LOOMCTX_KAFKA_SECURITY_PROTOCOL:-}
      LOOMCTX_KAFKA_SASL_MECHANISM: ${LOOMCTX_KAFKA_SASL_MECHANISM:-}
      LOOMCTX_KAFKA_SASL_USERNAME: ${LOOMCTX_KAFKA_SASL_USERNAME:-}
      LOOMCTX_KAFKA_SASL_PASSWORD: ${LOOMCTX_KAFKA_SASL_PASSWORD:-}
      LOOMCTX_KAFKA_SSL_CAFILE: ${LOOMCTX_KAFKA_SSL_CAFILE:-}
    volumes:
      - loomctx-data:/data
    depends_on:
      redpanda:
        condition: service_healthy

  redpanda:
    image: redpandadata/redpanda:v24.2.7@sha256:82a69763bef8d8b55ea5a520fa1b38f993908ef68946819ca1aed43541824c48
    profiles: ["kafka"]
    command: ["redpanda", "start", "--overprovisioned", "--smp", "1", "--memory", "512M",
              "--reserve-memory", "0M", "--node-id", "0", "--check=false",
              "--kafka-addr", "PLAINTEXT://0.0.0.0:9092", "--advertise-kafka-addr", "PLAINTEXT://redpanda:9092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 3s
      timeout: 5s
      retries: 20

  # Enrichment worker (D-018): embeddings + document claim extraction +
  # dossiers + entity resolution. One-shot drain: docker compose run --rm enrich
  #   python -m loomctx.enrich run --once
  enrich:
    build: .
    image: loomctx-engine:local
    healthcheck:
      disable: true    # no HTTP port here; the image's readyz check doesn't apply
    profiles: ["enrich"]
    command: python -m loomctx.enrich run --interval 30
    restart: unless-stopped
    volumes:
      - loomctx-data:/data
    environment:
      LOOMCTX_DB: ${LOOMCTX_DB:-/data/loomctx.db}
      LOOMCTX_LLM_MODEL: ${LOOMCTX_LLM_MODEL:-}
      LOOMCTX_LLM_PROVIDER: ${LOOMCTX_LLM_PROVIDER:-}
      LOOMCTX_LLM_BASE_URL: ${LOOMCTX_LLM_BASE_URL:-}
      LOOMCTX_LLM_API_KEY: ${LOOMCTX_LLM_API_KEY:-}
      LOOMCTX_EMBED_PROVIDER: ${LOOMCTX_EMBED_PROVIDER:-}
      LOOMCTX_EMBED_BASE_URL: ${LOOMCTX_EMBED_BASE_URL:-}
      LOOMCTX_EMBED_MODEL: ${LOOMCTX_EMBED_MODEL:-}
      LOOMCTX_EMBED_API_KEY: ${LOOMCTX_EMBED_API_KEY:-}
      LOOMCTX_EMBED_DIM: ${LOOMCTX_EMBED_DIM:-}
      LOOMCTX_EMBED_BATCH: ${LOOMCTX_EMBED_BATCH:-}
      # worker dials (D-039 / D-042)
      LOOMCTX_CHUNK_LIMIT: ${LOOMCTX_CHUNK_LIMIT:-}
      LOOMCTX_ALIAS_TYPES: ${LOOMCTX_ALIAS_TYPES:-}

  # MCP over streamable HTTP for remote agents. Local agents spawn stdio
  # instead: claude mcp add loomctx -- docker compose run --rm -T loomctx
  #   python -m loomctx.mcp_server
  # Auth (D-024): with LOOMCTX_AUTH_FILE / LOOMCTX_API_KEYS set, every request on
  # this transport must carry the same X-LoomCtx-Key / Bearer header as the
  # REST API, and each tool call is scoped by that key's grants. Unset =
  # open dev mode, which is why the port binds to localhost by default.
  mcp:
    build: .
    image: loomctx-engine:local
    healthcheck:
      disable: true    # the image's check probes the engine's :8000/readyz, which this service doesn't serve
    profiles: ["mcp"]
    restart: unless-stopped
    command: python -m loomctx.mcp_server --transport streamable-http --host 0.0.0.0 --port 8300
    ports:
      - "${LOOMCTX_BIND:-127.0.0.1}:8300:8300"
    volumes:
      - loomctx-data:/data
    environment:
      LOOMCTX_DB: ${LOOMCTX_DB:-/data/loomctx.db}
      LOOMCTX_MCP_NAMESPACE: ${LOOMCTX_MCP_NAMESPACE:-}
      # record_claim / run_query on the MCP surface; 0 hides the tool (docs/mcp-clients.md)
      LOOMCTX_MCP_WRITES: ${LOOMCTX_MCP_WRITES:-}
      LOOMCTX_MCP_QUERIES: ${LOOMCTX_MCP_QUERIES:-}
      LOOMCTX_LLM_MODEL: ${LOOMCTX_LLM_MODEL:-}
      LOOMCTX_LLM_PROVIDER: ${LOOMCTX_LLM_PROVIDER:-}
      LOOMCTX_LLM_BASE_URL: ${LOOMCTX_LLM_BASE_URL:-}
      LOOMCTX_LLM_API_KEY: ${LOOMCTX_LLM_API_KEY:-}
      # find_related and semantic ranking need the same embedder the
      # worker used; without this block that tool always errors here
      LOOMCTX_EMBED_PROVIDER: ${LOOMCTX_EMBED_PROVIDER:-}
      LOOMCTX_EMBED_BASE_URL: ${LOOMCTX_EMBED_BASE_URL:-}
      LOOMCTX_EMBED_MODEL: ${LOOMCTX_EMBED_MODEL:-}
      LOOMCTX_EMBED_API_KEY: ${LOOMCTX_EMBED_API_KEY:-}
      LOOMCTX_EMBED_DIM: ${LOOMCTX_EMBED_DIM:-}
      LOOMCTX_EMBED_QUERY_TIMEOUT: ${LOOMCTX_EMBED_QUERY_TIMEOUT:-}
      LOOMCTX_API_KEYS: ${LOOMCTX_API_KEYS:-}
      LOOMCTX_AUTH_FILE: ${LOOMCTX_AUTH_FILE:-}
      LOOMCTX_MAX_BUDGET: ${LOOMCTX_MAX_BUDGET:-}
      LOOMCTX_HANDLE_SECRET: ${LOOMCTX_HANDLE_SECRET:-}
      # per tool call; `answer` / `find_related` also spend the LLM bucket
      LOOMCTX_RATE_PER_SEC: ${LOOMCTX_RATE_PER_SEC:-}
      LOOMCTX_RATE_BURST: ${LOOMCTX_RATE_BURST:-}
      LOOMCTX_RATE_LLM_PER_SEC: ${LOOMCTX_RATE_LLM_PER_SEC:-}
      LOOMCTX_RATE_LLM_BURST: ${LOOMCTX_RATE_LLM_BURST:-}
      LOOMCTX_ALLOWED_HOSTS: ${LOOMCTX_ALLOWED_HOSTS:-}
      LOOMCTX_ALLOWED_ORIGINS: ${LOOMCTX_ALLOWED_ORIGINS:-}

  # TypeScript SDK toolchain (D-026): regen-check the generated contract
  # types, build, and run the client test against the live engine.
  #   docker compose --profile sdk run --rm sdk-ts
  sdk-ts:
    build:
      context: .
      dockerfile: sdk/typescript/Dockerfile
    profiles: ["sdk"]
    environment:
      LOOMCTX_URL: http://loomctx:8000
    volumes:
      - ./sdk/typescript/src:/app/src        # so `npm run gen` writes back
      - ./contracts:/contracts:ro
    depends_on:
      loomctx:
        condition: service_healthy

  # Go SDK toolchain (D-034): vet, contract drift test, live test.
  #   docker compose --profile sdk run --rm sdk-go
  sdk-go:
    build:
      context: .
      dockerfile: sdk/go/Dockerfile
    profiles: ["sdk"]
    environment:
      LOOMCTX_URL: http://loomctx:8000
    volumes:
      - ./contracts:/contracts:ro
    depends_on:
      loomctx:
        condition: service_healthy

  # Server-backed store for the database-scaling lane (D-011).
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f   # postgres 17 + the vector extension (D-025)
    profiles: ["pg"]
    environment:
      POSTGRES_USER: loomctx
      POSTGRES_PASSWORD: loomctx
      POSTGRES_DB: loomctx
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loomctx"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - pg-data:/var/lib/postgresql/data

  # A graph database (Neo4j) is a POSSIBLE GraphStore backend, not a shipped
  # one: nothing in the repo implements it (docs/decisions.md D-002,
  # docs/roadmap.md phase 5). If it is ever written, it would slot in here
  # as another profile the same way postgres does.

volumes:
  loomctx-data:
  nats-data:
  pg-data:
