[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loomctx-sdk"
version = "0.2.0"
description = "Thin, stdlib-only Python client for the LoomCtx context engine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.urls]
Homepage = "https://github.com/seahop/loomctx"

[tool.hatch.build.targets.wheel]
packages = ["loomctx_sdk"]
